<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#e2e8f0;overflow:hidden}
canvas{border:2px solid rgba(124,58,237,0.4);border-radius:8px}
.msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(10,10,26,0.96);padding:32px 48px;border-radius:16px;border:1px solid rgba(124,58,237,0.3);z-index:10}
.msg h2{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.msg p{color:#94a3b8;margin-bottom:16px}
.msg button{padding:10px 28px;border:none;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:1rem;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="400" height="500"></canvas>
<div class="msg" id="startScreen"><h2>🐦 Flappy Bird</h2><p>Press Space or Click to flap!</p><button onclick="startGame()">Play</button></div>
<div class="msg" id="overScreen" style="display:none"><h2>Game Over</h2><p>Score: <b id="finalScore">0</b> | Best: <b id="bestScore">0</b></p><button onclick="startGame()">Play Again</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const params=new URLSearchParams(window.location.search);
const DIFF=params.get('diff')||'medium';
const CONFIGS={easy:{gravity:0.28,flap:-5.5,gap:170,speed:2},medium:{gravity:0.35,flap:-6.5,gap:140,speed:2.5},hard:{gravity:0.4,flap:-7,gap:110,speed:3.5}};
const CFG=CONFIGS[DIFF]||CONFIGS.medium;
const GRAVITY=CFG.gravity,FLAP=CFG.flap,PIPE_W=52,PIPE_GAP=CFG.gap,PIPE_SPEED=CFG.speed,BIRD_R=14;
let bird,pipes,score,best=parseInt(localStorage.getItem('flappy_best'))||0,running=false,animId;

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('overScreen').style.display='none';
  bird={x:80,y:H/2,vy:0,angle:0};
  pipes=[];score=0;running=true;
  if(animId)cancelAnimationFrame(animId);
  loop();
}
function flap(){if(running)bird.vy=FLAP;}
function addPipe(){
  const minY=60,maxY=H-PIPE_GAP-60;
  const topH=Math.random()*(maxY-minY)+minY;
  pipes.push({x:W,topH,passed:false});
}
function loop(){
  update();draw();
  if(running)animId=requestAnimationFrame(loop);
}
function update(){
  bird.vy+=GRAVITY;bird.y+=bird.vy;
  bird.angle=Math.min(bird.vy*3,90);
  // Pipes
  if(pipes.length===0||pipes[pipes.length-1].x<W-200)addPipe();
  for(const p of pipes){
    p.x-=PIPE_SPEED;
    if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;}
    // Collision
    if(bird.x+BIRD_R>p.x&&bird.x-BIRD_R<p.x+PIPE_W){
      if(bird.y-BIRD_R<p.topH||bird.y+BIRD_R>p.topH+PIPE_GAP)die();
    }
  }
  pipes=pipes.filter(p=>p.x>-PIPE_W);
  if(bird.y+BIRD_R>H||bird.y-BIRD_R<0)die();
}
function die(){
  running=false;
  if(score>best){best=score;localStorage.setItem('flappy_best',best);}
  document.getElementById('finalScore').textContent=score;
  document.getElementById('bestScore').textContent=best;
  document.getElementById('overScreen').style.display='block';
  if(window.parent!==window)window.parent.postMessage({type:'score-submit',gameId:'flappy',score:score},'*');
}
function draw(){
  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f172a');grad.addColorStop(1,'#1e293b');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='rgba(255,255,255,0.15)';
  for(let i=0;i<30;i++){const sx=(i*137+score*0.3)%W,sy=(i*97)%H;ctx.fillRect(sx,sy,1.5,1.5);}
  // Pipes
  for(const p of pipes){
    ctx.fillStyle='#22c55e';ctx.shadowColor='#22c55e';ctx.shadowBlur=10;
    ctx.fillRect(p.x,0,PIPE_W,p.topH);
    ctx.fillRect(p.x,p.topH+PIPE_GAP,PIPE_W,H-p.topH-PIPE_GAP);
    // Pipe caps
    ctx.fillStyle='#16a34a';
    ctx.fillRect(p.x-4,p.topH-20,PIPE_W+8,20);
    ctx.fillRect(p.x-4,p.topH+PIPE_GAP,PIPE_W+8,20);
  }
  ctx.shadowBlur=0;
  // Bird
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.angle*Math.PI/180);
  ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(0,0,BIRD_R,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-4,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(8,-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(BIRD_R,0);ctx.lineTo(BIRD_R+10,-3);ctx.lineTo(BIRD_R+10,3);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
  // Score
  ctx.fillStyle='#fff';ctx.font='bold 32px Segoe UI';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
  ctx.fillText(score,W/2,50);ctx.shadowBlur=0;
}
document.addEventListener('keydown',e=>{if(e.key===' '){flap();e.preventDefault();}});
canvas.addEventListener('click',flap);
draw();
</script>
</body>
</html>
