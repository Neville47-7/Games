<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Country Conquest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;height:100vh;font-family:'Segoe UI',sans-serif;color:#e2e8f0;overflow:hidden}
.sidebar{width:260px;background:rgba(255,255,255,0.03);border-right:1px solid rgba(255,255,255,0.07);padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.sidebar h2{font-size:1.1rem;background:linear-gradient(135deg,#f59e0b,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.panel{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px}
.panel h3{font-size:0.7rem;text-transform:uppercase;color:#64748b;letter-spacing:1px;margin-bottom:6px}
.panel .val{font-size:1.3rem;font-weight:700;color:#f59e0b}
.panel .small{font-size:0.8rem;color:#94a3b8;margin-top:4px}
.player-info{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;margin-bottom:4px}
.player-info .dot{width:12px;height:12px;border-radius:50%}
.player-info .name{font-size:0.85rem;flex:1}
.player-info .troops{font-size:0.85rem;font-weight:600;color:#94a3b8}
.btn{width:100%;padding:10px;border:none;border-radius:10px;font-size:0.9rem;cursor:pointer;font-weight:600;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,#f59e0b,#fb923c);color:#fff}
.btn-primary:hover{opacity:0.9}
.btn-secondary{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94a3b8}
.btn-secondary:hover{background:rgba(255,255,255,0.1);color:#e2e8f0}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.log{max-height:120px;overflow-y:auto;font-size:0.75rem;color:#64748b;line-height:1.6}
.log .win{color:#22c55e}.log .lose{color:#ef4444}.log .info{color:#94a3b8}
.map-area{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
canvas{border-radius:12px;border:1px solid rgba(255,255,255,0.07)}
.tooltip{position:absolute;background:rgba(10,10,26,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 14px;font-size:0.8rem;pointer-events:none;display:none;z-index:10;min-width:140px}
.tooltip .tt-name{font-weight:700;font-size:0.9rem;margin-bottom:4px}
.tooltip .tt-owner{color:#94a3b8}
.tooltip .tt-troops{color:#f59e0b;font-weight:600}
.msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(10,10,26,0.96);padding:32px 48px;border-radius:16px;border:1px solid rgba(124,58,237,0.3);z-index:20}
.msg h2{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#f59e0b,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.msg p{color:#94a3b8;margin-bottom:16px}
.msg button{padding:10px 28px;border:none;border-radius:24px;background:linear-gradient(135deg,#f59e0b,#fb923c);color:#fff;font-size:1rem;cursor:pointer;font-weight:600}
.phase-indicator{text-align:center;padding:6px;border-radius:8px;background:rgba(245,158,11,0.1);color:#f59e0b;font-size:0.85rem;font-weight:600}
</style>
</head>
<body>
<div class="sidebar">
  <h2>🌍 Country Conquest</h2>
  <div class="phase-indicator" id="phaseIndicator">Your Turn — Select territory</div>
  <div class="panel"><h3>Turn</h3><div class="val" id="turnCount">1</div></div>
  <div id="playerList"></div>
  <div class="panel">
    <h3>Selected</h3>
    <div class="small" id="selectedInfo">Click a territory</div>
  </div>
  <button class="btn btn-primary" id="attackBtn" onclick="doAttack()" disabled>⚔️ Attack</button>
  <button class="btn btn-secondary" id="endTurnBtn" onclick="endTurn()">End Turn →</button>
  <div class="panel"><h3>Battle Log</h3><div class="log" id="log"></div></div>
</div>
<div class="map-area">
  <canvas id="c" width="700" height="500"></canvas>
  <div class="tooltip" id="tooltip"></div>
</div>
<div class="msg" id="startScreen"><h2>🌍 Country Conquest</h2><p>Conquer all territories to win!<br>Select your territory, then attack neighbors.</p><button onclick="startGame()">Start Conquest</button></div>
<div class="msg" id="overScreen" style="display:none"><h2 id="overTitle">Victory!</h2><p id="overMsg"></p><button onclick="startGame()">Play Again</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;

// Define territories as polygonal regions on an abstract "world map"
const TERRITORIES=[
  {id:0,name:'Northland',cx:150,cy:80,pts:[[60,30],[240,30],[260,100],[220,140],[80,140],[40,100]],neighbors:[1,2,3]},
  {id:1,name:'Eastport',cx:350,cy:70,pts:[[260,20],[460,20],[480,80],[460,130],[280,130],[260,80]],neighbors:[0,3,4]},
  {id:2,name:'Westmere',cx:100,cy:210,pts:[[20,150],[180,150],[200,220],[180,280],[20,280],[10,220]],neighbors:[0,3,5]},
  {id:3,name:'Central',cx:280,cy:200,pts:[[180,140],[380,140],[400,210],[380,270],[180,270],[160,210]],neighbors:[0,1,2,4,5,6]},
  {id:4,name:'Eastholm',cx:480,cy:190,pts:[[390,130],[620,130],[650,190],[630,260],[400,260],[380,190]],neighbors:[1,3,6]},
  {id:5,name:'Southvale',cx:140,cy:340,pts:[[20,290],[220,290],[240,340],[230,400],[40,400],[20,350]],neighbors:[2,3,6,7]},
  {id:6,name:'Midlands',cx:350,cy:330,pts:[[230,280],[500,280],[520,330],[500,390],[240,390],[220,330]],neighbors:[3,4,5,7,8]},
  {id:7,name:'Lowlands',cx:180,cy:440,pts:[[30,410],[260,410],[280,450],[260,490],[40,490],[20,450]],neighbors:[5,6,8]},
  {id:8,name:'Farreach',cx:450,cy:440,pts:[[270,400],[630,400],[660,440],[640,490],[280,490],[260,440]],neighbors:[6,7,4]},
];

const PLAYERS=[
  {id:0,name:'You',color:'#06b6d4',isHuman:true},
  {id:1,name:'Red Empire',color:'#ef4444',isHuman:false},
  {id:2,name:'Green Nation',color:'#22c55e',isHuman:false},
];

let territories,players,currentPlayer,turnCount,selected,target,gameOver;

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('overScreen').style.display='none';
  gameOver=false;turnCount=1;currentPlayer=0;selected=null;target=null;

  // Reset territories
  territories=TERRITORIES.map(t=>({...t,pts:[...t.pts.map(p=>[...p])]}));

  // Distribute territories
  const shuffled=[...Array(territories.length).keys()].sort(()=>Math.random()-0.5);
  shuffled.forEach((tIdx,i)=>{
    territories[tIdx].owner=i%PLAYERS.length;
    territories[tIdx].troops=3+Math.floor(Math.random()*3);
  });

  players=PLAYERS.map(p=>({...p}));
  updateUI();draw();
}

function updateUI(){
  document.getElementById('turnCount').textContent=turnCount;
  document.getElementById('phaseIndicator').textContent=
    players[currentPlayer].isHuman?'Your Turn — Select & Attack':'AI Thinking...';

  // Player list
  const list=document.getElementById('playerList');
  list.innerHTML='';
  players.forEach(p=>{
    const terrs=territories.filter(t=>t.owner===p.id);
    const totalTroops=terrs.reduce((s,t)=>s+t.troops,0);
    const div=document.createElement('div');
    div.className='player-info';
    div.style.background=`${p.color}15`;
    div.innerHTML=`<div class="dot" style="background:${p.color}"></div>
      <span class="name">${p.name}</span>
      <span class="troops">${terrs.length}🏴 ${totalTroops}⚔️</span>`;
    list.appendChild(div);
  });

  // Selected info
  if(selected!==null){
    const t=territories[selected];
    document.getElementById('selectedInfo').innerHTML=
      `<b>${t.name}</b><br>Troops: ${t.troops}<br>Owner: ${players[t.owner].name}`;
  }else{
    document.getElementById('selectedInfo').textContent='Click a territory';
  }

  // Buttons
  document.getElementById('attackBtn').disabled=!(selected!==null&&target!==null);
  document.getElementById('endTurnBtn').disabled=!players[currentPlayer].isHuman;
}

function addLog(text,cls='info'){
  const log=document.getElementById('log');
  log.innerHTML+=`<div class="${cls}">${text}</div>`;
  log.scrollTop=log.scrollHeight;
}

function doAttack(){
  if(selected===null||target===null)return;
  const attacker=territories[selected];
  const defender=territories[target];
  if(attacker.owner!==currentPlayer||defender.owner===currentPlayer)return;
  if(attacker.troops<=1)return;

  const atkForce=attacker.troops-1;
  const defForce=defender.troops;

  // Battle: each side rolls, attacker has slight advantage
  let atkPower=0,defPower=0;
  for(let i=0;i<atkForce;i++)atkPower+=Math.random()*1.1;
  for(let i=0;i<defForce;i++)defPower+=Math.random();

  if(atkPower>defPower){
    // Attacker wins
    const surviving=Math.max(1,Math.ceil(atkForce*(atkPower/(atkPower+defPower))));
    defender.owner=currentPlayer;
    defender.troops=surviving;
    attacker.troops=1;
    addLog(`⚔️ ${attacker.name} → ${defender.name}: Victory! (+${surviving})`,`win`);
  }else{
    // Defender wins
    const defSurviving=Math.max(1,Math.ceil(defForce*(defPower/(atkPower+defPower))));
    defender.troops=defSurviving;
    attacker.troops=1;
    addLog(`🛡️ ${attacker.name} → ${defender.name}: Repelled!`,'lose');
  }

  selected=null;target=null;
  checkGameEnd();
  updateUI();draw();
}

function endTurn(){
  // Reinforce: +1 troop per territory owned
  const owned=territories.filter(t=>t.owner===currentPlayer);
  const reinforcements=Math.max(1,Math.floor(owned.length/2));
  // Add to random owned territory
  if(owned.length>0){
    for(let i=0;i<reinforcements;i++){
      owned[Math.floor(Math.random()*owned.length)].troops++;
    }
  }

  selected=null;target=null;
  currentPlayer=(currentPlayer+1)%players.length;

  // Skip eliminated players
  let safety=0;
  while(!territories.some(t=>t.owner===currentPlayer)&&safety<10){
    currentPlayer=(currentPlayer+1)%players.length;
    safety++;
  }

  if(currentPlayer===0)turnCount++;

  if(!players[currentPlayer].isHuman&&!gameOver){
    updateUI();draw();
    setTimeout(aiTurn,600);
  }else{
    updateUI();draw();
  }
}

function aiTurn(){
  if(gameOver)return;
  const myTerritories=territories.filter(t=>t.owner===currentPlayer);
  // Try to attack a neighbor
  let attacked=false;
  for(const t of myTerritories.sort((a,b)=>b.troops-a.troops)){
    if(t.troops<=2)continue;
    const targets=t.neighbors.map(n=>territories[n]).filter(n=>n.owner!==currentPlayer);
    const weakTarget=targets.sort((a,b)=>a.troops-b.troops)[0];
    if(weakTarget&&t.troops>weakTarget.troops*0.8){
      selected=t.id;target=weakTarget.id;
      doAttack();
      attacked=true;
      break;
    }
  }
  if(!gameOver)setTimeout(()=>endTurn(),attacked?400:200);
}

function checkGameEnd(){
  const owners=new Set(territories.map(t=>t.owner));
  if(owners.size===1){
    gameOver=true;
    const winner=players[[...owners][0]];
    document.getElementById('overTitle').textContent=
      winner.isHuman?'🏆 You Conquered the World!':'Defeat...';
    document.getElementById('overMsg').textContent=
      winner.isHuman?`Victory in ${turnCount} turns!`:`${winner.name} conquered everything.`;
    document.getElementById('overScreen').style.display='block';
  }
}

function draw(){
  ctx.fillStyle='#0f0f2a';ctx.fillRect(0,0,W,H);

  // Ocean pattern
  ctx.fillStyle='rgba(6,182,212,0.03)';
  for(let y=0;y<H;y+=20)for(let x=0;x<W;x+=20){
    if((x+y)%40===0)ctx.fillRect(x,y,10,10);
  }

  // Draw territories
  for(const t of territories){
    const owner=players[t.owner];
    const isSelected=selected===t.id;
    const isTarget=target===t.id;

    ctx.beginPath();
    ctx.moveTo(t.pts[0][0],t.pts[0][1]);
    for(let i=1;i<t.pts.length;i++)ctx.lineTo(t.pts[i][0],t.pts[i][1]);
    ctx.closePath();

    // Fill
    ctx.fillStyle=owner.color+(isSelected?'60':isTarget?'40':'25');
    ctx.fill();

    // Border
    ctx.strokeStyle=isSelected?'#fff':isTarget?'#facc15':owner.color+'80';
    ctx.lineWidth=isSelected?3:isTarget?2.5:1.5;
    ctx.stroke();

    // Territory name
    ctx.font='bold 11px Segoe UI';ctx.textAlign='center';
    ctx.fillStyle=isSelected?'#fff':'#e2e8f0';
    ctx.fillText(t.name,t.cx,t.cy-8);

    // Troops
    ctx.font='bold 16px Segoe UI';
    ctx.fillStyle=owner.color;
    ctx.shadowColor=owner.color;ctx.shadowBlur=8;
    ctx.fillText('⚔️'+t.troops,t.cx,t.cy+14);
    ctx.shadowBlur=0;
  }
}

// Click handling
canvas.addEventListener('click',e=>{
  if(!players[currentPlayer].isHuman||gameOver)return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);

  // Find clicked territory
  let clicked=null;
  for(const t of territories){
    if(pointInPoly(mx,my,t.pts)){clicked=t.id;break;}
  }
  if(clicked===null)return;

  const terr=territories[clicked];
  if(terr.owner===currentPlayer){
    // Select own territory
    selected=clicked;target=null;
  }else if(selected!==null){
    // Select enemy as target (must be neighbor)
    const src=territories[selected];
    if(src.neighbors.includes(clicked)){
      target=clicked;
    }
  }
  updateUI();draw();
});

// Tooltip
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  const tt=document.getElementById('tooltip');

  for(const t of territories){
    if(pointInPoly(mx,my,t.pts)){
      tt.style.display='block';
      tt.style.left=(e.clientX-canvas.parentElement.getBoundingClientRect().left+15)+'px';
      tt.style.top=(e.clientY-canvas.parentElement.getBoundingClientRect().top-10)+'px';
      tt.innerHTML=`<div class="tt-name">${t.name}</div>
        <div class="tt-owner">Owner: ${players[t.owner].name}</div>
        <div class="tt-troops">Troops: ${t.troops}</div>`;
      return;
    }
  }
  tt.style.display='none';
});
canvas.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.display='none';});

function pointInPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
</script>
</body>
</html>
