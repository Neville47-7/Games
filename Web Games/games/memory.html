<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Memory Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#e2e8f0;overflow:hidden}
.hud{display:flex;gap:20px;margin-bottom:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.hud span{color:#94a3b8}.hud b{color:#f472b6}
.mode-badge{font-size:0.7rem;padding:3px 10px;border-radius:12px;font-weight:600}
.mode-badge.easy{background:rgba(52,211,153,0.2);color:#34d399}
.mode-badge.medium{background:rgba(251,146,60,0.2);color:#fb923c}
.mode-badge.hard{background:rgba(239,68,68,0.2);color:#ef4444}
.mode-badge.mp{background:rgba(124,58,237,0.2);color:#a78bfa}
.p-indicator{font-size:0.9rem;font-weight:700;padding:4px 14px;border-radius:10px}
.p-indicator.p1{background:rgba(6,182,212,0.15);color:#06b6d4}
.p-indicator.p2{background:rgba(244,114,182,0.15);color:#f472b6}
.board{display:grid;gap:8px;max-width:500px}
.card{width:70px;height:70px;border-radius:10px;cursor:pointer;perspective:600px;position:relative}
.card-inner{width:100%;height:100%;transition:transform 0.4s;transform-style:preserve-3d;position:relative}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}
.card.matched{opacity:0.5;pointer-events:none}
.card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center}
.card-back{background:linear-gradient(135deg,#7c3aed,#f472b6);border:2px solid rgba(255,255,255,0.1);font-size:1.4rem}
.card-front{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.1);transform:rotateY(180deg);font-size:1.8rem}
.msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(10,10,26,0.96);padding:32px 48px;border-radius:16px;border:1px solid rgba(124,58,237,0.3);z-index:10}
.msg h2{font-size:1.6rem;margin-bottom:8px;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.msg p{color:#94a3b8;margin-bottom:16px;line-height:1.5}
.msg button{padding:10px 28px;border:none;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:1rem;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<div class="board" id="board"></div>
<div class="msg" id="winScreen" style="display:none"><h2 id="winTitle">🎉 You Win!</h2><p id="winMsg"></p><button onclick="init()">Play Again</button></div>
<script>
const params=new URLSearchParams(window.location.search);
const DIFF=params.get('diff')||'medium';
const MP=parseInt(params.get('mp'))||1;
const isMP=MP>=2;

const GRID={easy:{cols:4,rows:2,pairs:4},medium:{cols:4,rows:4,pairs:8},hard:{cols:6,rows:4,pairs:12}};
const cfg=GRID[DIFF]||GRID.medium;
const ALL_EMOJIS=['🎮','🎲','🎯','🏆','⭐','💎','🔥','🚀','🎵','🎨','🌟','🍕','🎪','🎭','🌈','🦋'];
const EMOJIS=ALL_EMOJIS.slice(0,cfg.pairs);

let cards,flipped=[],matched=0,moves=0,locked=false;
let currentPlayer=1,p1Score=0,p2Score=0;

function buildHUD(){
  const hud=document.getElementById('hud');
  let html=`<span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/${cfg.pairs}</span>`;
  html+=`<span class="mode-badge ${DIFF}">${DIFF}</span>`;
  if(isMP){
    html+=`<span class="mode-badge mp">2P</span>`;
    html+=`<span class="p-indicator p1" id="pind">P1's Turn</span>`;
    html+=`<span>P1: <b id="p1s" style="color:#06b6d4">0</b></span>`;
    html+=`<span>P2: <b id="p2s" style="color:#f472b6">0</b></span>`;
  }
  hud.innerHTML=html;
}

function init(){
  document.getElementById('winScreen').style.display='none';
  matched=0;moves=0;flipped=[];locked=false;
  currentPlayer=1;p1Score=0;p2Score=0;
  cards=shuffle([...EMOJIS,...EMOJIS]);
  buildHUD();
  const board=document.getElementById('board');
  board.style.gridTemplateColumns=`repeat(${cfg.cols},70px)`;
  board.innerHTML='';
  cards.forEach((emoji,i)=>{
    const card=document.createElement('div');card.className='card';card.dataset.idx=i;
    card.innerHTML=`<div class="card-inner"><div class="card-back">?</div><div class="card-front">${emoji}</div></div>`;
    card.onclick=()=>flip(card,i);
    board.appendChild(card);
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function flip(card,idx){
  if(locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;
  card.classList.add('flipped');flipped.push({card,idx});
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;locked=true;
    const[a,b]=flipped;
    if(cards[a.idx]===cards[b.idx]){
      a.card.classList.add('matched');b.card.classList.add('matched');
      matched++;document.getElementById('pairs').textContent=matched;
      if(isMP){
        if(currentPlayer===1){p1Score++;document.getElementById('p1s').textContent=p1Score;}
        else{p2Score++;document.getElementById('p2s').textContent=p2Score;}
      }
      flipped=[];locked=false;
      if(matched===cfg.pairs)showWin();
    }else{
      setTimeout(()=>{
        a.card.classList.remove('flipped');b.card.classList.remove('flipped');
        flipped=[];locked=false;
        if(isMP){
          currentPlayer=currentPlayer===1?2:1;
          const pind=document.getElementById('pind');
          pind.textContent=`P${currentPlayer}'s Turn`;
          pind.className='p-indicator '+(currentPlayer===1?'p1':'p2');
        }
      },700);
    }
  }
}
function showWin(){
  const title=document.getElementById('winTitle');
  const msg=document.getElementById('winMsg');
  if(isMP){
    if(p1Score>p2Score){title.textContent='🎉 Player 1 Wins!';}
    else if(p2Score>p1Score){title.textContent='🎉 Player 2 Wins!';}
    else{title.textContent='🤝 It\'s a Draw!';}
    msg.textContent=`P1: ${p1Score} pairs | P2: ${p2Score} pairs | ${moves} moves`;
  }else{
    title.textContent='🎉 You Win!';
    msg.textContent=`Completed in ${moves} moves`;
  }
  document.getElementById('winScreen').style.display='block';
}
init();
</script>
</body>
</html>
