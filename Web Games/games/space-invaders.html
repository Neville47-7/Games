<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Space Invaders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#e2e8f0;overflow:hidden}
.hud{display:flex;gap:30px;margin-bottom:10px;font-size:1rem}
.hud span{color:#94a3b8}.hud b{color:#7c3aed}
canvas{border:2px solid rgba(124,58,237,0.4);border-radius:8px}
.msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(10,10,26,0.96);padding:32px 48px;border-radius:16px;border:1px solid rgba(124,58,237,0.3);z-index:10}
.msg h2{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.msg p{color:#94a3b8;margin-bottom:16px}
.msg button{padding:10px 28px;border:none;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:1rem;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span>Wave: <b id="wave">1</b></span></div>
<canvas id="c" width="480" height="440"></canvas>
<div class="msg" id="startScreen"><h2>👾 Space Invaders</h2><p>Arrow keys to move, Space to shoot!</p><button onclick="startGame()">Play</button></div>
<div class="msg" id="overScreen" style="display:none"><h2 id="overTitle">Game Over</h2><p>Score: <b id="finalScore">0</b></p><button onclick="startGame()">Play Again</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const params=new URLSearchParams(window.location.search);
const DIFF=params.get('diff')||'medium';
const SICFG={easy:{lives:5,shootRate:0.012,moveDelay:70,eBulletSpd:2},medium:{lives:3,shootRate:0.02,moveDelay:60,eBulletSpd:3},hard:{lives:2,shootRate:0.035,moveDelay:40,eBulletSpd:4}};
const SI=SICFG[DIFF]||SICFG.medium;
let player,invaders,bullets,eBullets,score,lives,wave,invDir,invSpeed,invTimer,running,keys={},animId;
const PLAYER_W=36,PLAYER_H=20,INV_W=28,INV_H=20,INV_COLS=8,INV_ROWS=4,INV_PAD=8;
const INVADER_TYPES=['👾','👽','🤖','💀'];
const INV_COLORS=['#06b6d4','#34d399','#facc15','#f472b6'];

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('overScreen').style.display='none';
  player={x:W/2-PLAYER_W/2,y:H-40};
  score=0;lives=SI.lives;wave=1;
  bullets=[];eBullets=[];running=true;
  setupInvaders();updateHUD();
  if(animId)cancelAnimationFrame(animId);
  loop();
}
function setupInvaders(){
  invaders=[];invDir=1;invSpeed=1;invTimer=0;
  const startX=(W-(INV_COLS*(INV_W+INV_PAD)))/2;
  for(let r=0;r<INV_ROWS;r++)for(let c=0;c<INV_COLS;c++){
    invaders.push({x:startX+c*(INV_W+INV_PAD),y:40+r*(INV_H+INV_PAD+4),row:r,alive:true});
  }
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent=lives;
  document.getElementById('wave').textContent=wave;
}
function loop(){
  if(!running)return;
  update();draw();animId=requestAnimationFrame(loop);
}
function update(){
  // Player movement
  if(keys['ArrowLeft']&&player.x>0)player.x-=4;
  if(keys['ArrowRight']&&player.x<W-PLAYER_W)player.x+=4;
  // Player bullets
  bullets.forEach(b=>b.y-=7);
  bullets=bullets.filter(b=>b.y>0);
  // Enemy bullets
  eBullets.forEach(b=>b.y+=3);
  eBullets=eBullets.filter(b=>b.y<H);
  // Invader movement
  invTimer++;
  if(invTimer>Math.max(10,SI.moveDelay-wave*5)){
    invTimer=0;
    let edge=false;
    for(const inv of invaders){
      if(!inv.alive)continue;
      if((inv.x+INV_W>=W-10&&invDir>0)||(inv.x<=10&&invDir<0))edge=true;
    }
    if(edge){invDir*=-1;invaders.forEach(inv=>{if(inv.alive)inv.y+=INV_H;});}
    else invaders.forEach(inv=>{if(inv.alive)inv.x+=invDir*(10+wave);});
  }
  // Enemy shoot
  if(Math.random()<SI.shootRate){
    const alive=invaders.filter(i=>i.alive);
    if(alive.length){const shooter=alive[Math.floor(Math.random()*alive.length)];eBullets.push({x:shooter.x+INV_W/2,y:shooter.y+INV_H});}
  }
  // Bullet-invader collision
  for(const b of bullets){
    for(const inv of invaders){
      if(!inv.alive)continue;
      if(b.x>inv.x&&b.x<inv.x+INV_W&&b.y>inv.y&&b.y<inv.y+INV_H){
        inv.alive=false;b.y=-10;score+=10*(inv.row+1);updateHUD();
      }
    }
  }
  // Enemy bullet-player collision
  for(const b of eBullets){
    if(b.x>player.x&&b.x<player.x+PLAYER_W&&b.y>player.y&&b.y<player.y+PLAYER_H){
      b.y=H+10;lives--;updateHUD();
      if(lives<=0){running=false;document.getElementById('overTitle').textContent='Game Over';document.getElementById('finalScore').textContent=score;document.getElementById('overScreen').style.display='block';if(window.parent!==window)window.parent.postMessage({type:'score-submit',gameId:'space-invaders',score:score},'*');return;}
    }
  }
  // Invaders reach bottom
  for(const inv of invaders){
    if(inv.alive&&inv.y+INV_H>=player.y){
      running=false;document.getElementById('overTitle').textContent='Game Over';document.getElementById('finalScore').textContent=score;document.getElementById('overScreen').style.display='block';if(window.parent!==window)window.parent.postMessage({type:'score-submit',gameId:'space-invaders',score:score},'*');return;
    }
  }
  // Wave clear
  if(invaders.every(i=>!i.alive)){wave++;setupInvaders();updateHUD();}
}
function draw(){
  ctx.fillStyle='#0f0f2a';ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='rgba(255,255,255,0.1)';
  for(let i=0;i<40;i++){ctx.fillRect((i*97)%W,(i*137+score*0.1)%H,1,1);}
  // Invaders
  for(const inv of invaders){
    if(!inv.alive)continue;
    ctx.font=`${INV_H}px serif`;ctx.textAlign='center';
    ctx.fillText(INVADER_TYPES[inv.row],inv.x+INV_W/2,inv.y+INV_H-2);
  }
  // Player
  ctx.fillStyle='#06b6d4';ctx.shadowColor='#06b6d4';ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.moveTo(player.x+PLAYER_W/2,player.y);
  ctx.lineTo(player.x+PLAYER_W,player.y+PLAYER_H);
  ctx.lineTo(player.x,player.y+PLAYER_H);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // Bullets
  ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=8;
  bullets.forEach(b=>{ctx.fillRect(b.x-2,b.y,4,10);});
  ctx.fillStyle='#ef4444';ctx.shadowColor='#ef4444';
  eBullets.forEach(b=>{ctx.fillRect(b.x-2,b.y,4,8);});
  ctx.shadowBlur=0;
}
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '&&running){
    if(bullets.length<3)bullets.push({x:player.x+PLAYER_W/2,y:player.y});
    e.preventDefault();
  }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
draw();
</script>
</body>
</html>
