<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#e2e8f0;overflow:hidden;user-select:none}
.hud{display:flex;gap:20px;margin-bottom:16px}
.hud-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 20px;text-align:center}
.hud-box label{font-size:0.7rem;text-transform:uppercase;color:#64748b;letter-spacing:1px}
.hud-box .val{font-size:1.4rem;font-weight:700;color:#06b6d4}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(255,255,255,0.04);border:2px solid rgba(124,58,237,0.3);border-radius:12px;padding:8px;width:340px;height:340px}
.tile{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;transition:all 0.15s ease;background:rgba(255,255,255,0.03);color:#94a3b8}
.tile.pop{animation:pop 0.2s ease}
@keyframes pop{0%{transform:scale(0.5)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(10,10,26,0.96);padding:32px 48px;border-radius:16px;border:1px solid rgba(124,58,237,0.3);z-index:10}
.msg h2{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.msg p{color:#94a3b8;margin-bottom:16px}
.msg button{padding:10px 28px;border:none;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:1rem;cursor:pointer;font-weight:600}
.hint{margin-top:12px;font-size:0.8rem;color:#64748b}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-box"><label>Score</label><div class="val" id="score">0</div></div>
  <div class="hud-box"><label>Best</label><div class="val" id="best">0</div></div>
</div>
<div class="board" id="board"></div>
<div class="hint">Arrow Keys or Swipe to move tiles</div>
<div class="msg" id="overScreen" style="display:none"><h2>Game Over</h2><p>Score: <b id="finalScore">0</b></p><button onclick="init()">Play Again</button></div>
<script>
const TILE_COLORS={
  2:'#334155',4:'#475569',8:'#fb923c',16:'#f97316',32:'#ef4444',64:'#dc2626',
  128:'#facc15',256:'#eab308',512:'#a3e635',1024:'#22c55e',2048:'#06b6d4',4096:'#7c3aed',8192:'#a855f7'
};
const TILE_TEXT={2:'#e2e8f0',4:'#e2e8f0',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#1a1a2e',256:'#1a1a2e',512:'#1a1a2e',1024:'#fff',2048:'#fff',4096:'#fff',8192:'#fff'};
let grid,score,best=parseInt(localStorage.getItem('2048_best'))||0;
document.getElementById('best').textContent=best;

function init(){
  document.getElementById('overScreen').style.display='none';
  grid=Array.from({length:4},()=>Array(4).fill(0));
  score=0;addTile();addTile();render();
}
function addTile(){
  const empty=[];
  grid.forEach((r,ri)=>r.forEach((v,ci)=>{if(!v)empty.push([ri,ci]);}));
  if(!empty.length)return;
  const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function render(){
  const b=document.getElementById('board');
  b.innerHTML='';
  grid.forEach(row=>row.forEach(v=>{
    const t=document.createElement('div');
    t.className='tile'+(v?' pop':'');
    if(v){
      t.textContent=v;
      t.style.background=TILE_COLORS[v]||'#7c3aed';
      t.style.color=TILE_TEXT[v]||'#fff';
      t.style.fontSize=v>=1024?'1.1rem':v>=128?'1.3rem':'1.5rem';
    }
    b.appendChild(t);
  }));
  document.getElementById('score').textContent=score;
  if(score>best){best=score;localStorage.setItem('2048_best',best);document.getElementById('best').textContent=best;}
}
function slide(row){
  let a=row.filter(v=>v),merged=false;
  for(let i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);}
  }
  while(a.length<4)a.push(0);
  return a;
}
function move(dir){
  let moved=false;const prev=JSON.stringify(grid);
  if(dir==='left')grid=grid.map(r=>slide(r));
  else if(dir==='right')grid=grid.map(r=>slide([...r].reverse()).reverse());
  else if(dir==='up'){
    for(let c=0;c<4;c++){let col=grid.map(r=>r[c]);col=slide(col);col.forEach((v,r)=>grid[r][c]=v);}
  }else{
    for(let c=0;c<4;c++){let col=grid.map(r=>r[c]).reverse();col=slide(col).reverse();col.forEach((v,r)=>grid[r][c]=v);}
  }
  if(JSON.stringify(grid)!==prev){moved=true;addTile();render();}
  if(!canMove()){document.getElementById('finalScore').textContent=score;document.getElementById('overScreen').style.display='block';}
}
function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return true;
    if(c<3&&grid[r][c]===grid[r][c+1])return true;
    if(r<3&&grid[r][c]===grid[r+1][c])return true;
  }return false;
}
document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){move(map[e.key]);e.preventDefault();}
});
let tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){move(dx>0?'right':'left');}else{move(dy>0?'down':'up');}
});
init();
</script>
</body>
</html>
